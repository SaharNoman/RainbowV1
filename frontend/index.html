<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Rainbow Inventory — Head Office</title>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;600&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap" rel="stylesheet"/>
<style>
  :root {
    --bg:#f0f2f5; --surface:#fff; --border:#e2e6ea;
    --green:#1a6b3c; --green-light:#e8f5ee;
    --red:#c0392b; --red-light:#fdecea;
    --orange:#e67e22; --orange-light:#fef3e2;
    --blue:#1a5fa8; --blue-light:#e8f0fb;
    --crimson:#8b0000; --crimson-light:#ffe4e4;
    --text:#1a1d23; --muted:#6c757d;
    --mono:'IBM Plex Mono',monospace; --sans:'IBM Plex Sans',sans-serif;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:var(--sans);background:var(--bg);color:var(--text);min-height:100vh}

  /* Header */
  header{background:var(--green);color:#fff;padding:0 28px;height:60px;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:100;box-shadow:0 2px 8px rgba(0,0,0,.15)}
  header h1{font-size:17px;font-weight:700}
  .header-right{display:flex;align-items:center;gap:14px}
  .header-right span{font-size:12px;opacity:.75;font-family:var(--mono)}
  .notify-btn{background:#fff;color:var(--green);border:2px solid rgba(255,255,255,.6);padding:7px 16px;border-radius:7px;font-size:13px;font-weight:700;cursor:pointer;font-family:var(--sans);transition:all .2s}
  .notify-btn:hover{background:var(--green-light)}
  .notify-btn:disabled{opacity:.6;cursor:not-allowed}

  /* Main tabs */
  .main-tabs{display:flex;background:var(--surface);border-bottom:2px solid var(--border);padding:0 28px}
  .main-tab{padding:14px 24px;font-size:14px;font-weight:600;cursor:pointer;border:none;background:none;font-family:var(--sans);color:var(--muted);border-bottom:3px solid transparent;margin-bottom:-2px;transition:all .2s}
  .main-tab.active{color:var(--green);border-bottom-color:var(--green)}
  .main-tab.sales-active{color:var(--blue);border-bottom-color:var(--blue)}

  /* Layout */
  .layout{display:flex;height:calc(100vh - 100px)}

  /* Sidebar */
  aside{width:210px;background:var(--surface);border-right:1px solid var(--border);padding:16px 0;flex-shrink:0;overflow-y:auto}
  aside h3{font-size:10px;font-weight:600;letter-spacing:1.2px;text-transform:uppercase;color:var(--muted);padding:0 16px 10px}
  .store-btn{display:flex;align-items:center;justify-content:space-between;width:100%;padding:9px 16px;background:none;border:none;cursor:pointer;font-family:var(--sans);font-size:13px;font-weight:500;color:var(--text);transition:background .15s;text-align:left}
  .store-btn:hover{background:var(--bg)}
  .store-btn.active{background:var(--green-light);color:var(--green);font-weight:600}
  .store-badge{font-size:11px;font-family:var(--mono);background:var(--red-light);color:var(--red);border-radius:10px;padding:2px 7px;font-weight:600}
  .store-badge.ok{background:var(--green-light);color:var(--green)}

  /* Main content */
  main{flex:1;overflow-y:auto;padding:22px 28px}

  /* Clickable summary cards */
  .summary-row{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:14px;margin-bottom:22px}
  .stat-card{background:var(--surface);border:1px solid var(--border);border-radius:10px;padding:18px;transition:all .2s}
  .stat-card.clickable{cursor:pointer}
  .stat-card.clickable:hover{transform:translateY(-2px);box-shadow:0 4px 12px rgba(0,0,0,.1)}
  .stat-card .label{font-size:11px;color:var(--muted);font-weight:500;margin-bottom:5px;text-transform:uppercase;letter-spacing:.5px}
  .stat-card .value{font-size:28px;font-weight:700;font-family:var(--mono)}
  /* Selected states */
  .stat-card.sel-all{border-color:var(--green);background:var(--green-light);border-width:2px}
  .stat-card.sel-all .value{color:var(--green)}
  .stat-card.sel-low{border-color:var(--red);background:var(--red-light);border-width:2px}
  .stat-card.sel-low .value{color:var(--red)}
  .stat-card.sel-neg{border-color:var(--crimson);background:var(--crimson-light);border-width:2px}
  .stat-card.sel-neg .value{color:var(--crimson)}
  .stat-card.sel-saleslow{border-color:var(--blue);background:var(--blue-light);border-width:2px}
  .stat-card.sel-saleslow .value{color:var(--blue)}
  .stat-card.sel-drop{border-color:var(--orange);background:var(--orange-light);border-width:2px}
  .stat-card.sel-drop .value{color:var(--orange)}
  /* Alert colors */
  .stat-card.danger{border-color:var(--red);background:var(--red-light)}
  .stat-card.danger .value{color:var(--red)}
  .stat-card.crimson-card{border-color:var(--crimson);background:var(--crimson-light)}
  .stat-card.crimson-card .value{color:var(--crimson)}
  .stat-card.blue-card{border-color:var(--blue);background:var(--blue-light)}
  .stat-card.blue-card .value{color:var(--blue)}
  .stat-card.amber-card{border-color:var(--orange);background:var(--orange-light)}
  .stat-card.amber-card .value{color:var(--orange)}

  /* Alert banner */
  .alert-banner{border-radius:10px;padding:12px 18px;margin-bottom:20px;display:flex;align-items:center;gap:12px}
  .alert-banner .icon{font-size:20px}
  .alert-banner strong{font-size:14px}
  .alert-banner p{font-size:12px;color:var(--muted);margin-top:2px}

  /* Month selector */
  .month-bar{display:flex;align-items:center;gap:12px;margin-bottom:20px;flex-wrap:wrap}
  .month-bar label{font-size:13px;font-weight:600;color:var(--muted)}
  .month-select{padding:7px 12px;border:1px solid var(--border);border-radius:7px;font-family:var(--sans);font-size:13px;background:var(--surface);cursor:pointer;outline:none}

  /* Section header */
  .section-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px}
  .section-header h2{font-size:15px;font-weight:700}

  /* Search */
  .search-bar{width:100%;padding:9px 14px;border:1px solid var(--border);border-radius:8px;font-size:14px;font-family:var(--sans);margin-bottom:14px;background:var(--surface);outline:none}
  .search-bar:focus{border-color:var(--green)}

  /* Table */
  .table-wrap{background:var(--surface);border:1px solid var(--border);border-radius:10px;overflow:hidden}
  table{width:100%;border-collapse:collapse}
  thead{background:#f8f9fa}
  th{padding:11px 14px;text-align:left;font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:.7px;color:var(--muted);border-bottom:1px solid var(--border)}
  td{padding:11px 14px;font-size:13px;border-bottom:1px solid var(--border)}
  tr:last-child td{border-bottom:none}
  tr:hover td{background:#fafbfc}
  tr.low-row td{background:var(--red-light)}
  tr.low-row:hover td{background:#fad7d3}
  tr.neg-row td{background:var(--crimson-light)}
  tr.neg-row:hover td{background:#ffc0c0}
  tr.drop-crit td{background:var(--crimson-light)}
  tr.drop-warn td{background:var(--orange-light)}

  .badge{display:inline-block;padding:3px 10px;border-radius:20px;font-size:11px;font-weight:600;font-family:var(--mono)}
  .badge.low{background:var(--red-light);color:var(--red)}
  .badge.ok{background:var(--green-light);color:var(--green)}
  .badge.neg{background:var(--crimson-light);color:var(--crimson)}
  .badge.crit{background:var(--crimson-light);color:var(--crimson)}
  .badge.warn{background:var(--orange-light);color:var(--orange)}
  .badge.no-thresh{background:#f0f0f0;color:var(--muted)}

  .num{font-family:var(--mono);font-size:13px;font-weight:600}
  .num.low{color:var(--red)} .num.ok{color:var(--green)}
  .num.neg{color:var(--crimson)} .num.grey{color:var(--muted)}

  .thresh-input{width:70px;padding:4px 8px;border:1px solid var(--border);border-radius:5px;font-family:var(--mono);font-size:13px;text-align:center}
  .save-btn{padding:4px 10px;font-size:12px;background:var(--green);color:#fff;border:none;border-radius:5px;cursor:pointer;font-family:var(--sans);margin-left:5px}
  .save-btn.blue{background:var(--blue)}
  .manual-badge{display:inline-block;font-size:10px;background:#fff3cd;color:#856404;border:1px solid #ffc107;border-radius:4px;padding:1px 6px;font-weight:600;margin-left:4px}
  .auto-badge{display:inline-block;font-size:10px;background:var(--green-light);color:var(--green);border:1px solid #a8d5b8;border-radius:4px;padding:1px 6px;font-weight:600;margin-left:4px}
  .reset-btn{padding:3px 8px;font-size:11px;background:#fff3cd;color:#856404;border:1px solid #ffc107;border-radius:5px;cursor:pointer;font-family:var(--sans);margin-left:4px}
  .auto-hint{font-size:10px;color:var(--muted);font-family:var(--mono);display:block;margin-top:2px}

  .loading{text-align:center;padding:50px;color:var(--muted);font-size:14px}
  .empty{text-align:center;padding:50px;color:var(--muted)}

  #toast{position:fixed;bottom:22px;right:22px;background:var(--green);color:#fff;padding:11px 18px;border-radius:8px;font-size:14px;font-weight:500;opacity:0;transition:opacity .3s;pointer-events:none;z-index:999}
  #toast.show{opacity:1}
  #toast.error{background:var(--red)}
</style>
</head>
<body>

<header>
  <h1>🛒 Rainbow Grocery — Head Office Dashboard</h1>
  <div class="header-right">
    <span id="last-updated">Loading...</span>
    <button class="notify-btn" id="notify-stock-btn" onclick="sendStockAlert()">📦 Stock Alert</button>
    <button class="notify-btn" id="notify-sales-btn" onclick="sendSalesAlert()" style="background:var(--blue-light);color:var(--blue);border-color:rgba(255,255,255,.4)">📈 Sales Alert</button>
  </div>
</header>

<div class="main-tabs">
  <button class="main-tab active" id="tab-stock" onclick="switchMode('stock')">📦 Stock Inventory</button>
  <button class="main-tab" id="tab-sales" onclick="switchMode('sales')">📈 Sales Data</button>
</div>

<div class="layout">
  <aside>
    <h3>Stores</h3>
    <div id="store-list"><div class="loading">...</div></div>
  </aside>
  <main id="main-content"><div class="loading">Loading...</div></main>
</div>

<div id="toast"></div>

<script>
const API = window.location.hostname === '127.0.0.1' || window.location.hostname === 'localhost'
  ? 'http://127.0.0.1:8000' : '';

let mode         = 'stock';
let currentStore = null;
let stockFilter  = 'all';   // all | low | neg
let salesFilter  = 'all';   // all | low | drop
let storeSummary = {};
let salesSummary = {};
let months       = [];
let selectedMonth = '';
let allStockItems = [];
let allSalesItems = [];
let negStockItems = [];
let salesDropItems = [];

// ══════════════════════════════
//  INIT
// ══════════════════════════════
async function init() {
  await Promise.all([loadStoreSummary(), loadMonths()]);
  await loadSalesSummary();
  await renderSidebar();
  await renderMain();
  document.getElementById('last-updated').textContent = 'Updated: ' + new Date().toLocaleTimeString();
}

async function loadMonths() {
  try {
    const r = await fetch(`${API}/sales/months`);
    months = await r.json();
    selectedMonth = months[months.length - 1];
  } catch(e) {}
}

async function loadStoreSummary() {
  try { storeSummary = await fetch(`${API}/dashboard/stock-summary`).then(r=>r.json()); } catch(e) {}
}

async function loadSalesSummary() {
  if (!selectedMonth) return;
  try { salesSummary = await fetch(`${API}/sales/summary?month=${selectedMonth}`).then(r=>r.json()); } catch(e) {}
}

// ══════════════════════════════
//  MODE & STORE
// ══════════════════════════════
async function switchMode(m) {
  mode = m;
  stockFilter = 'all';
  salesFilter = 'all';
  ['stock','sales'].forEach(t => {
    document.getElementById(`tab-${t}`).classList.remove('active','sales-active');
  });
  if (m === 'stock') document.getElementById('tab-stock').classList.add('active');
  if (m === 'sales') document.getElementById('tab-sales').classList.add('sales-active');
  await renderSidebar();
  await renderMain();
}

async function selectStore(store) {
  currentStore = store;
  stockFilter = 'all';
  salesFilter = 'all';
  await renderSidebar();
  await renderMain();
}

// ══════════════════════════════
//  SIDEBAR
// ══════════════════════════════
async function renderSidebar() {
  try {
    const stores = await fetch(`${API}/stores`).then(r=>r.json());
    const list = document.getElementById('store-list');
    list.innerHTML = '';

    const allBtn = document.createElement('button');
    allBtn.className = 'store-btn' + (!currentStore ? ' active' : '');
    allBtn.innerHTML = `All Stores <span class="store-badge ok" style="margin-left:4px">${stores.length}</span>`;
    allBtn.onclick = () => selectStore(null);
    list.appendChild(allBtn);

    stores.forEach(store => {
      const s   = storeSummary[store] || {};
      const low = s.low_stock_items || 0;
      const btn = document.createElement('button');
      btn.className = 'store-btn' + (currentStore === store ? ' active' : '');
      btn.innerHTML = `${store} <span class="store-badge ${low===0?'ok':''}">${low===0?'✓':low+' low'}</span>`;
      btn.onclick = () => selectStore(store);
      list.appendChild(btn);
    });
  } catch(e) {}
}

// ══════════════════════════════
//  MAIN ROUTER
// ══════════════════════════════
async function renderMain() {
  if (mode === 'stock') await renderStockMain();
  else await renderSalesMain();
}

// ══════════════════════════════
//  STOCK VIEW
// ══════════════════════════════
async function renderStockMain() {
  const main = document.getElementById('main-content');
  main.innerHTML = '<div class="loading">Loading inventory...</div>';

  try {
    // Fetch stock + negative stock in parallel
    const stockUrl = currentStore ? `${API}/inventory?store=${currentStore}` : `${API}/inventory`;
    const negUrl   = currentStore ? `${API}/alerts/negative-stock?store=${currentStore}` : `${API}/alerts/negative-stock`;

    const [stockRes, negRes] = await Promise.all([fetch(stockUrl), fetch(negUrl)]);
    allStockItems  = await stockRes.json();
    negStockItems  = await negRes.json();

    const stores  = currentStore ? [currentStore] : Object.keys(storeSummary);
    let total=0, low=0;
    stores.forEach(s => {
      total += storeSummary[s]?.total_items || 0;
      low   += storeSummary[s]?.low_stock_items || 0;
    });
    const neg    = negStockItems.length;
    const health = total > 0 ? Math.round((1-low/total)*100) : 100;

    const banner = low > 0 ? `
      <div class="alert-banner" style="background:var(--red-light);border:1px solid #f5c6c2">
        <div class="icon">🔴</div>
        <div><strong style="color:var(--red)">⚠ ${low} Low Stock Alert${low>1?'s':''}</strong>
        <p>${low} item${low>1?' are':' is'} below threshold${currentStore?' in '+currentStore:' across all stores'}.</p></div>
      </div>` : '';

    main.innerHTML = `
      ${banner}
      <div class="summary-row">
        <div class="stat-card clickable ${stockFilter==='all'?'sel-all':''}" onclick="setStockFilter('all')">
          <div class="label">📦 Total Items</div><div class="value">${total}</div>
        </div>
        <div class="stat-card clickable ${low>0?'danger':''} ${stockFilter==='low'?'sel-low':''}" onclick="setStockFilter('low')">
          <div class="label">⚠ Low Stock</div><div class="value">${low}</div>
        </div>
        <div class="stat-card clickable ${neg>0?'crimson-card':''} ${stockFilter==='neg'?'sel-neg':''}" onclick="setStockFilter('neg')">
          <div class="label">⛔ Negative Stock</div><div class="value">${neg}</div>
        </div>
      </div>
      <div class="section-header" style="margin-bottom:14px"><h2 id="stock-title">Loading...</h2></div>
      <input class="search-bar" id="stock-search" type="text" placeholder="Search items..." oninput="renderStockTable()"/>
      <div class="table-wrap">
        <table>
          <thead><tr>
            <th>Item Name</th><th>Category</th><th>Store</th>
            <th>Stock</th><th>Threshold</th><th>Status</th>
          </tr></thead>
          <tbody id="stock-tbody"></tbody>
        </table>
      </div>`;

    renderStockTable();
  } catch(e) {
    main.innerHTML = '<div class="empty">❌ Cannot connect to API. Is the server running?</div>';
  }
}

function setStockFilter(f) {
  stockFilter = f;
  renderStockMain();
}

function renderStockTable() {
  const tbody  = document.getElementById('stock-tbody');
  const title  = document.getElementById('stock-title');
  const search = (document.getElementById('stock-search')?.value||'').toLowerCase();
  if (!tbody) return;

  let items = [];
  if (stockFilter === 'neg') {
    items = negStockItems.filter(i =>
      i.item_name.toLowerCase().includes(search) ||
      i.store_name.toLowerCase().includes(search)
    );
    if (title) title.textContent = `${items.length} Negative Stock Item${items.length!==1?'s':''}${currentStore?' — '+currentStore:''}`;
    tbody.innerHTML = items.length === 0
      ? `<tr><td colspan="6" class="empty">✅ No negative stock items found.</td></tr>`
      : items.map(i => `
        <tr class="neg-row">
          <td>${i.item_name}</td><td>${i.category}</td>
          <td><strong>${i.store_name}</strong></td>
          <td><span class="num neg">${i.current_stock}</span></td>
          <td>${i.threshold}</td>
          <td><span class="badge neg">⛔ NEGATIVE</span></td>
        </tr>`).join('');
    return;
  }

  items = allStockItems.filter(i => {
    const m = i.item_name.toLowerCase().includes(search) ||
              i.category.toLowerCase().includes(search) ||
              i.store_name.toLowerCase().includes(search);
    return m && (stockFilter === 'all' || i.is_low);
  });

  if (title) title.textContent = `${items.length} Item${items.length!==1?'s':''}${currentStore?' — '+currentStore:''}`;

  tbody.innerHTML = items.length === 0
    ? `<tr><td colspan="6" class="empty">No items found.</td></tr>`
    : items.map(i => `
      <tr class="${i.is_low?'low-row':''}">
        <td>${i.item_name}</td><td>${i.category}</td>
        <td><strong>${i.store_name}</strong></td>
        <td><span class="num ${i.is_low?'low':'ok'}">${i.current_stock}</span></td>
        <td>
          <input class="thresh-input" type="number" value="${i.threshold}" id="st-${i.id}" min="0"/>
          <button class="save-btn" onclick="saveStockThreshold(${i.id})">Save</button>
        </td>
        <td><span class="badge ${i.is_low?'low':'ok'}">${i.is_low?'⚠ LOW':'✓ OK'}</span></td>
      </tr>`).join('');
}

async function saveStockThreshold(id) {
  const val = document.getElementById(`st-${id}`).value;
  await fetch(`${API}/inventory/${id}/threshold?threshold=${val}`, {method:'PUT'});
  showToast('Stock threshold updated ✓');
  await loadStoreSummary();
  await renderStockMain();
}

// ══════════════════════════════
//  SALES VIEW
// ══════════════════════════════
async function renderSalesMain() {
  const main = document.getElementById('main-content');
  main.innerHTML = '<div class="loading">Loading sales data...</div>';

  try {
    const monthOptions = months.map(m =>
      `<option value="${m}" ${m===selectedMonth?'selected':''}>${m}</option>`
    ).join('');

    // Fetch sales + drop alerts in parallel
    const salesUrl = currentStore
      ? `${API}/sales?month=${selectedMonth}&store=${currentStore}`
      : `${API}/sales?month=${selectedMonth}`;
    const dropUrl = currentStore
      ? `${API}/alerts/sales-drop?drop_pct=30&month=${selectedMonth}&store=${currentStore}`
      : `${API}/alerts/sales-drop?drop_pct=30&month=${selectedMonth}`;

    const [salesRes, dropRes] = await Promise.all([fetch(salesUrl), fetch(dropUrl)]);
    allSalesItems  = await salesRes.json();
    salesDropItems = await dropRes.json();

    const stores = currentStore ? [currentStore] : Object.keys(salesSummary);
    let totalItems=0, lowItems=0, totalQty=0;
    stores.forEach(s => {
      totalItems += salesSummary[s]?.total_items || 0;
      lowItems   += salesSummary[s]?.low_sales_items || 0;
      totalQty   += salesSummary[s]?.total_quantity || 0;
    });
    const dropCount = salesDropItems.length;
    const prevMonth = dropCount > 0 ? salesDropItems[0].prev_month : '';

    const banner = lowItems > 0 ? `
      <div class="alert-banner" style="background:var(--blue-light);border:1px solid #b8d0f0">
        <div class="icon">🔵</div>
        <div><strong style="color:var(--blue)">⚠ ${lowItems} Low Sales Alert${lowItems>1?'s':''}</strong>
        <p>${lowItems} item${lowItems>1?' are':' is'} below sales threshold for ${selectedMonth}.</p></div>
      </div>` : '';

    main.innerHTML = `
      <div class="month-bar">
        <label>📅 Month:</label>
        <select class="month-select" onchange="onMonthChange(this.value)">${monthOptions}</select>
      </div>
      ${banner}
      <div class="summary-row">
        <div class="stat-card clickable ${salesFilter==='all'?'sel-all':''}" onclick="setSalesFilter('all')">
          <div class="label">📦 Total Items</div><div class="value">${totalItems}</div>
        </div>
        <div class="stat-card clickable ${lowItems>0?'blue-card':''} ${salesFilter==='low'?'sel-saleslow':''}" onclick="setSalesFilter('low')">
          <div class="label">⚠ Low Sales</div><div class="value">${lowItems}</div>
        </div>
        <div class="stat-card clickable ${dropCount>0?'amber-card':''} ${salesFilter==='drop'?'sel-drop':''}" onclick="setSalesFilter('drop')">
          <div class="label">📉 Sales Drop (30%+)</div><div class="value">${dropCount}</div>
        </div>
      </div>
      <div class="section-header" style="margin-bottom:14px"><h2 id="sales-title">Loading...</h2></div>
      <input class="search-bar" id="sales-search" type="text" placeholder="Search articles..." oninput="renderSalesTable()"/>
      <div class="table-wrap">
        <table>
          <thead id="sales-thead"></thead>
          <tbody id="sales-tbody"></tbody>
        </table>
      </div>`;

    renderSalesTable();
  } catch(e) {
    main.innerHTML = '<div class="empty">❌ Cannot connect to API.</div>';
  }
}

function setSalesFilter(f) {
  salesFilter = f;
  renderSalesMain();
}

function renderSalesTable() {
  const tbody  = document.getElementById('sales-tbody');
  const thead  = document.getElementById('sales-thead');
  const title  = document.getElementById('sales-title');
  const search = (document.getElementById('sales-search')?.value||'').toLowerCase();
  if (!tbody) return;

  if (salesFilter === 'drop') {
    if (thead) thead.innerHTML = `<tr><th>Article</th><th>Category</th><th>Store</th><th>Prev Month</th><th>This Month</th><th>Drop %</th><th>Severity</th></tr>`;
    const items = salesDropItems.filter(i =>
      i.article.toLowerCase().includes(search) || i.store_name.toLowerCase().includes(search)
    );
    const prevMonth = items.length > 0 ? items[0].prev_month : '';
    if (title) title.textContent = `${items.length} Sales Drop Alert${items.length!==1?'s':''} — ${selectedMonth} vs ${prevMonth}`;
    tbody.innerHTML = items.length === 0
      ? `<tr><td colspan="7" class="empty">✅ No sales drops of 30%+ found.</td></tr>`
      : items.map(i => `
        <tr class="${i.severity==='critical'?'drop-crit':'drop-warn'}">
          <td>${i.article}</td><td>${i.category}</td>
          <td><strong>${i.store_name}</strong></td>
          <td><span class="num ok">${i.prev_qty}</span></td>
          <td><span class="num ${i.severity==='critical'?'low':'grey'}">${i.current_qty}</span></td>
          <td><strong style="color:${i.severity==='critical'?'var(--crimson)':'var(--orange)'}">${i.drop_pct}%</strong></td>
          <td><span class="badge ${i.severity==='critical'?'crit':'warn'}">${i.severity==='critical'?'🔴 CRITICAL':'🟡 WARNING'}</span></td>
        </tr>`).join('');
    return;
  }

  if (thead) thead.innerHTML = `<tr><th>Article</th><th>Category</th><th>Store</th><th>Qty Sold</th><th>Sales Threshold</th><th>Status</th></tr>`;
  const items = allSalesItems.filter(i => {
    const m = i.article.toLowerCase().includes(search) ||
              i.category.toLowerCase().includes(search) ||
              i.store_name.toLowerCase().includes(search);
    return m && (salesFilter === 'all' || i.is_low);
  });

  if (title) title.textContent = `${items.length} Item${items.length!==1?'s':''} — ${selectedMonth}${currentStore?' — '+currentStore:''}`;

  tbody.innerHTML = items.length === 0
    ? `<tr><td colspan="6" class="empty">No items found.</td></tr>`
    : items.map(i => {
        const hasT = i.threshold > 0;
        const manBadge = i.threshold_manual
          ? `<span class="manual-badge">✏ Manual</span>`
          : `<span class="auto-badge">⚡ Auto</span>`;
        const resetBtn = i.threshold_manual
          ? `<button class="reset-btn" onclick="resetSalesThreshold(${i.id})">↺</button>` : '';
        const hint = `<span class="auto-hint">${i.threshold_manual?'auto: '+i.threshold_auto:'avg prev 3 months'}</span>`;
        return `
        <tr class="${i.is_low?'low-row':''}">
          <td>${i.article}</td><td>${i.category}</td>
          <td><strong>${i.store_name}</strong></td>
          <td><span class="num ${!hasT?'grey':i.is_low?'low':'ok'}">${i.quantity}</span></td>
          <td>
            <input class="thresh-input" type="number" value="${i.threshold}" id="sl-${i.id}" min="0"/>
            <button class="save-btn blue" onclick="saveSalesThreshold(${i.id})">Save</button>
            ${resetBtn}${manBadge}${hint}
          </td>
          <td><span class="badge ${!hasT?'no-thresh':i.is_low?'low':'ok'}">${!hasT?'No threshold':i.is_low?'⚠ LOW':'✓ OK'}</span></td>
        </tr>`;
      }).join('');
}

async function saveSalesThreshold(id) {
  const val = document.getElementById(`sl-${id}`).value;
  await fetch(`${API}/sales/${id}/threshold?threshold=${val}`, {method:'PUT'});
  showToast('Sales threshold updated ✓');
  await loadSalesSummary();
  await renderSalesMain();
}

async function resetSalesThreshold(id) {
  await fetch(`${API}/sales/${id}/threshold/reset`, {method:'PUT'});
  showToast('↺ Reset to auto average ✓');
  await renderSalesMain();
}

async function onMonthChange(m) {
  selectedMonth = m;
  await loadSalesSummary();
  await renderSalesMain();
}

// ══════════════════════════════
//  EMAIL ALERT
// ══════════════════════════════
async function sendStockAlert() {
  const btn = document.getElementById('notify-stock-btn');
  btn.disabled = true;
  btn.textContent = '⏳ Sending...';
  try {
    const url = currentStore ? `${API}/notify/send-stock?store=${currentStore}` : `${API}/notify/send-stock`;
    const res  = await fetch(url, {method:'POST'});
    const data = await res.json();
    if (data.status === 'sent') showToast(`✅ Stock alert sent! ${data.items_reported} items reported.`);
    else if (data.status === 'skipped') showToast('✅ No low stock — nothing to report!');
    else showToast('❌ ' + data.message, true);
  } catch(e) { showToast('❌ Could not reach server', true); }
  btn.disabled = false;
  btn.innerHTML = '📦 Stock Alert';
}

async function sendSalesAlert() {
  const btn = document.getElementById('notify-sales-btn');
  btn.disabled = true;
  btn.textContent = '⏳ Sending...';
  try {
    const month = selectedMonth || '';
    const url = currentStore
      ? `${API}/notify/send-sales?store=${currentStore}&month=${month}`
      : `${API}/notify/send-sales?month=${month}`;
    const res  = await fetch(url, {method:'POST'});
    const data = await res.json();
    if (data.status === 'sent') showToast(`✅ Sales alert sent! ${data.items_reported} items reported.`);
    else if (data.status === 'skipped') showToast('✅ No low sales — nothing to report!');
    else showToast('❌ ' + data.message, true);
  } catch(e) { showToast('❌ Could not reach server', true); }
  btn.disabled = false;
  btn.innerHTML = '📈 Sales Alert';
}

async function sendAlertNow() {
  const btn = document.getElementById('notify-btn');
  btn.disabled = true; btn.textContent = '⏳ Sending...';
  try {
    const url = currentStore ? `${API}/notify/send-now?store=${currentStore}` : `${API}/notify/send-now`;
    const data = await fetch(url, {method:'POST'}).then(r=>r.json());
    if (data.status === 'sent') showToast(`✅ Email sent! ${data.items_reported} items reported.`);
    else if (data.status === 'skipped') showToast('✅ No low stock — nothing to report!');
    else showToast('❌ ' + data.message, true);
  } catch(e) { showToast('❌ Could not reach server', true); }
  btn.disabled = false; btn.innerHTML = '📧 Send Alert Now';
}

// ══════════════════════════════
//  TOAST
// ══════════════════════════════
function showToast(msg, isError=false) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.toggle('error', isError);
  t.classList.add('show');
  setTimeout(() => t.classList.remove('show'), 3000);
}

init();
</script>
