<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Rainbow Inventory — Head Office</title>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;600&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap" rel="stylesheet"/>
<style>
  :root {
    --bg:#f0f2f5; --surface:#fff; --border:#e2e6ea;
    --green:#1a6b3c; --green-light:#e8f5ee;
    --red:#c0392b; --red-light:#fdecea;
    --orange:#e67e22; --orange-light:#fef3e2;
    --blue:#1a5fa8; --blue-light:#e8f0fb;
    --text:#1a1d23; --muted:#6c757d;
    --mono:'IBM Plex Mono',monospace; --sans:'IBM Plex Sans',sans-serif;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:var(--sans);background:var(--bg);color:var(--text);min-height:100vh}

  /* Header */
  header{background:var(--green);color:#fff;padding:0 28px;height:60px;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:100;box-shadow:0 2px 8px rgba(0,0,0,.15)}
  header h1{font-size:17px;font-weight:700}
  .header-right{display:flex;align-items:center;gap:14px}
  .header-right span{font-size:12px;opacity:.75;font-family:var(--mono)}
  .notify-btn{background:#fff;color:var(--green);border:2px solid rgba(255,255,255,.6);padding:7px 16px;border-radius:7px;font-size:13px;font-weight:700;cursor:pointer;font-family:var(--sans);transition:all .2s}
  .notify-btn:hover{background:var(--green-light)}
  .notify-btn:disabled{opacity:.6;cursor:not-allowed}

  /* Main tabs (Stock / Sales) */
  .main-tabs{display:flex;background:var(--surface);border-bottom:2px solid var(--border);padding:0 28px}
  .main-tab{padding:14px 24px;font-size:14px;font-weight:600;cursor:pointer;border:none;background:none;font-family:var(--sans);color:var(--muted);border-bottom:3px solid transparent;margin-bottom:-2px;transition:all .2s}
  .main-tab.active{color:var(--green);border-bottom-color:var(--green)}
  .main-tab.sales-tab.active{color:var(--blue);border-bottom-color:var(--blue)}

  /* Layout */
  .layout{display:flex;height:calc(100vh - 100px)}

  /* Sidebar */
  aside{width:210px;background:var(--surface);border-right:1px solid var(--border);padding:16px 0;flex-shrink:0;overflow-y:auto}
  aside h3{font-size:10px;font-weight:600;letter-spacing:1.2px;text-transform:uppercase;color:var(--muted);padding:0 16px 10px}
  .store-btn{display:flex;align-items:center;justify-content:space-between;width:100%;padding:9px 16px;background:none;border:none;cursor:pointer;font-family:var(--sans);font-size:13px;font-weight:500;color:var(--text);transition:background .15s;text-align:left}
  .store-btn:hover{background:var(--bg)}
  .store-btn.active{background:var(--green-light);color:var(--green);font-weight:600}
  .store-btn.active.sales-mode{background:var(--blue-light);color:var(--blue)}
  .store-badge{font-size:11px;font-family:var(--mono);background:var(--red-light);color:var(--red);border-radius:10px;padding:2px 7px;font-weight:600}
  .store-badge.ok{background:var(--green-light);color:var(--green)}
  .store-badge.blue{background:var(--blue-light);color:var(--blue)}

  /* Main content */
  main{flex:1;overflow-y:auto;padding:22px 28px}

  /* Month selector */
  .month-bar{display:flex;align-items:center;gap:12px;margin-bottom:20px;flex-wrap:wrap}
  .month-bar label{font-size:13px;font-weight:600;color:var(--muted)}
  .month-select{padding:7px 12px;border:1px solid var(--border);border-radius:7px;font-family:var(--sans);font-size:13px;background:var(--surface);cursor:pointer;outline:none}
  .month-select:focus{border-color:var(--blue)}

  /* Alert banner */
  .alert-banner{background:var(--red-light);border:1px solid #f5c6c2;border-radius:10px;padding:12px 18px;margin-bottom:20px;display:flex;align-items:center;gap:12px}
  .alert-banner.blue{background:var(--blue-light);border-color:#b8d0f0}
  .alert-banner .icon{font-size:20px}
  .alert-banner strong{font-size:14px;color:var(--red)}
  .alert-banner.blue strong{color:var(--blue)}
  .alert-banner p{font-size:12px;color:var(--muted);margin-top:2px}

  /* Summary cards */
  .summary-row{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:14px;margin-bottom:22px}
  .stat-card{background:var(--surface);border:1px solid var(--border);border-radius:10px;padding:18px}
  .stat-card .label{font-size:11px;color:var(--muted);font-weight:500;margin-bottom:5px;text-transform:uppercase;letter-spacing:.5px}
  .stat-card .value{font-size:30px;font-weight:700;font-family:var(--mono)}
  .stat-card.danger{border-color:var(--red);background:var(--red-light)}
  .stat-card.danger .value{color:var(--red)}
  .stat-card.blue-card{border-color:var(--blue);background:var(--blue-light)}
  .stat-card.blue-card .value{color:var(--blue)}

  /* Section header */
  .section-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px;flex-wrap:wrap;gap:8px}
  .section-header h2{font-size:15px;font-weight:700}
  .tabs{display:flex;gap:4px}
  .tab{padding:6px 14px;border-radius:6px;border:1px solid var(--border);background:var(--surface);font-size:13px;font-weight:500;cursor:pointer;font-family:var(--sans);transition:all .15s}
  .tab.active{background:var(--green);color:#fff;border-color:var(--green)}
  .tab.active.blue{background:var(--blue);border-color:var(--blue)}

  /* Search */
  .search-bar{width:100%;padding:9px 14px;border:1px solid var(--border);border-radius:8px;font-size:14px;font-family:var(--sans);margin-bottom:14px;background:var(--surface);outline:none;transition:border-color .15s}
  .search-bar:focus{border-color:var(--green)}

  /* Table */
  .table-wrap{background:var(--surface);border:1px solid var(--border);border-radius:10px;overflow:hidden}
  table{width:100%;border-collapse:collapse}
  thead{background:#f8f9fa}
  th{padding:11px 14px;text-align:left;font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:.7px;color:var(--muted);border-bottom:1px solid var(--border)}
  td{padding:11px 14px;font-size:13px;border-bottom:1px solid var(--border)}
  tr:last-child td{border-bottom:none}
  tr:hover td{background:#fafbfc}
  tr.low-row td{background:var(--red-light)}
  tr.low-row:hover td{background:#fad7d3}

  .badge{display:inline-block;padding:3px 10px;border-radius:20px;font-size:11px;font-weight:600;font-family:var(--mono)}
  .badge.low{background:var(--red-light);color:var(--red)}
  .badge.ok{background:var(--green-light);color:var(--green)}
  .badge.no-thresh{background:#f0f0f0;color:var(--muted)}

  .num{font-family:var(--mono);font-size:13px;font-weight:600}
  .num.low{color:var(--red)}
  .num.ok{color:var(--green)}
  .num.grey{color:var(--muted)}

  .thresh-input{width:70px;padding:4px 8px;border:1px solid var(--border);border-radius:5px;font-family:var(--mono);font-size:13px;text-align:center}
  .thresh-input:focus{outline:none;border-color:var(--green)}
  .save-btn{padding:4px 10px;font-size:12px;background:var(--green);color:#fff;border:none;border-radius:5px;cursor:pointer;font-family:var(--sans);margin-left:5px}
  .save-btn:hover{opacity:.85}
  .save-btn.blue{background:var(--blue)}

  .loading{text-align:center;padding:50px;color:var(--muted);font-size:14px}
  .empty{text-align:center;padding:50px;color:var(--muted)}

  #toast{position:fixed;bottom:22px;right:22px;background:var(--green);color:#fff;padding:11px 18px;border-radius:8px;font-size:14px;font-weight:500;opacity:0;transition:opacity .3s;pointer-events:none;z-index:999;max-width:360px}
  #toast.show{opacity:1}
  #toast.error{background:var(--red)}

  .manual-badge{display:inline-block;font-size:10px;background:#fff3cd;color:#856404;border:1px solid #ffc107;border-radius:4px;padding:1px 6px;font-weight:600;margin-left:4px;vertical-align:middle}
  .auto-badge{display:inline-block;font-size:10px;background:var(--green-light);color:var(--green);border:1px solid #a8d5b8;border-radius:4px;padding:1px 6px;font-weight:600;margin-left:4px;vertical-align:middle}
  .reset-btn{padding:3px 8px;font-size:11px;background:#fff3cd;color:#856404;border:1px solid #ffc107;border-radius:5px;cursor:pointer;font-family:var(--sans);margin-left:4px}
  .reset-btn:hover{background:#ffe69c}
  .thresh-wrap{display:flex;align-items:center;flex-wrap:wrap;gap:4px}
  .auto-hint{font-size:10px;color:var(--muted);font-family:var(--mono);width:100%;margin-top:2px}
</style>
</head>
<body>

<header>
  <h1>🛒 Rainbow Grocery — Head Office Dashboard</h1>
  <div class="header-right">
    <span id="last-updated">Loading...</span>
    <button class="notify-btn" id="notify-btn" onclick="sendAlertNow()">📧 Send Alert Now</button>
  </div>
</header>

<!-- Main mode tabs -->
<div class="main-tabs">
  <button class="main-tab active" id="tab-stock" onclick="switchMode('stock')">📦 Stock Inventory</button>
  <button class="main-tab sales-tab" id="tab-sales" onclick="switchMode('sales')">📈 Sales Data</button>
</div>

<div class="layout">
  <aside>
    <h3>Stores</h3>
    <div id="store-list"><div class="loading">...</div></div>
  </aside>

  <main id="main-content">
    <div class="loading">Loading...</div>
  </main>
</div>

<div id="toast"></div>

<script>
const API = window.location.hostname === "127.0.0.1" || window.location.hostname === "localhost" ? "http://127.0.0.1:8000" : "";

let mode         = "stock";   // "stock" | "sales"
let currentStore = null;
let stockTab     = "all";     // "all" | "low"
let salesTab     = "all";
let allStockItems = [];
let allSalesItems = [];
let storeSummary  = {};
let salesSummary  = {};
let months        = [];
let selectedMonth = "";

// ══════════════════════════════════════════════
//  INIT
// ══════════════════════════════════════════════
async function init() {
  await loadMonths();
  await Promise.all([loadStoreSummary(), loadSalesSummary()]);
  await renderSidebar();
  await renderMain();
  document.getElementById("last-updated").textContent =
    "Updated: " + new Date().toLocaleTimeString();
}

// ══════════════════════════════════════════════
//  MODE SWITCH (Stock / Sales)
// ══════════════════════════════════════════════
async function switchMode(m) {
  mode = m;
  document.getElementById("tab-stock").classList.toggle("active", m === "stock");
  document.getElementById("tab-sales").classList.toggle("active", m === "sales");
  document.querySelectorAll(".store-btn").forEach(b => {
    b.classList.toggle("sales-mode", m === "sales");
  });
  await renderSidebar();
  await renderMain();
}

// ══════════════════════════════════════════════
//  MONTHS
// ══════════════════════════════════════════════
async function loadMonths() {
  try {
    const res = await fetch(`${API}/sales/months`);
    months = await res.json();
    selectedMonth = months[months.length - 1]; // default: latest
  } catch(e) { months = []; }
}

// ══════════════════════════════════════════════
//  SUMMARIES
// ══════════════════════════════════════════════
async function loadStoreSummary() {
  try {
    const res = await fetch(`${API}/dashboard/stock-summary`);
    storeSummary = await res.json();
  } catch(e) {}
}

async function loadSalesSummary() {
  if (!selectedMonth) return;
  try {
    const res = await fetch(`${API}/sales/summary?month=${selectedMonth}`);
    salesSummary = await res.json();
  } catch(e) {}
}

// ══════════════════════════════════════════════
//  SIDEBAR
// ══════════════════════════════════════════════
async function renderSidebar() {
  try {
    const res    = await fetch(`${API}/stores`);
    const stores = await res.json();
    const list   = document.getElementById("store-list");
    list.innerHTML = "";

    const allBtn = document.createElement("button");
    allBtn.className = "store-btn active" + (mode === "sales" ? " sales-mode" : "");
    allBtn.id = "store-btn-all";
    allBtn.textContent = "All Stores";
    allBtn.onclick = () => selectStore(null);
    list.appendChild(allBtn);

    stores.forEach(store => {
      const btn = document.createElement("button");
      btn.className = "store-btn" + (mode === "sales" ? " sales-mode" : "");
      btn.id = `store-btn-${store}`;

      if (mode === "stock") {
        const s   = storeSummary[store] || {};
        const low = s.low_stock_items || 0;
        btn.innerHTML = `${store} <span class="store-badge ${low===0?'ok':''}">${low===0?'✓':low+' low'}</span>`;
      } else {
        const s   = salesSummary[store] || {};
        const low = s.low_sales_items || 0;
        btn.innerHTML = `${store} <span class="store-badge ${low===0?'ok':'blue'}">${low===0?'✓':low+' low'}</span>`;
      }

      btn.onclick = () => selectStore(store);
      list.appendChild(btn);
    });

    // Mark active
    const activeId = currentStore ? `store-btn-${currentStore}` : "store-btn-all";
    document.querySelectorAll(".store-btn").forEach(b => b.classList.remove("active"));
    document.getElementById(activeId)?.classList.add("active");

  } catch(e) {}
}

async function selectStore(store) {
  currentStore = store;
  await renderSidebar();
  await renderMain();
}

// ══════════════════════════════════════════════
//  MAIN CONTENT ROUTER
// ══════════════════════════════════════════════
async function renderMain() {
  if (mode === "stock") await renderStockMain();
  else await renderSalesMain();
}

// ══════════════════════════════════════════════
//  STOCK VIEW
// ══════════════════════════════════════════════
async function renderStockMain() {
  const main = document.getElementById("main-content");

  // Compute stats
  const stores = currentStore ? [currentStore] : Object.keys(storeSummary);
  let total = 0, low = 0;
  stores.forEach(s => {
    total += storeSummary[s]?.total_items || 0;
    low   += storeSummary[s]?.low_stock_items || 0;
  });
  const health = total > 0 ? Math.round((1 - low/total)*100) : 100;

  // Alert banner
  const bannerHtml = low > 0 ? `
    <div class="alert-banner" id="alert-banner">
      <div class="icon">🔴</div>
      <div>
        <strong>⚠ ${low} Low Stock Alert${low>1?'s':''}</strong>
        <p>${low} item${low>1?' are':' is'} below threshold${currentStore?' in '+currentStore:' across all stores'}. Reorder required.</p>
      </div>
    </div>` : "";

  main.innerHTML = `
    ${bannerHtml}
    <div class="summary-row">
      <div class="stat-card"><div class="label">Total Items</div><div class="value">${total}</div></div>
      <div class="stat-card ${low>0?'danger':''}"><div class="label">Low Stock</div><div class="value">${low}</div></div>
      <div class="stat-card"><div class="label">Stores</div><div class="value">${stores.length}</div></div>
      <div class="stat-card"><div class="label">Health</div><div class="value">${health}%</div></div>
    </div>
    <div class="section-header">
      <h2 id="stock-title">All Items</h2>
      <div class="tabs">
        <button class="tab ${stockTab==='all'?'active':''}" onclick="setStockTab('all')">All Items</button>
        <button class="tab ${stockTab==='low'?'active':''}" onclick="setStockTab('low')">⚠ Low Stock Only</button>
      </div>
    </div>
    <input class="search-bar" type="text" id="stock-search" placeholder="Search items..." oninput="renderStockTable()"/>
    <div class="table-wrap">
      <table>
        <thead><tr>
          <th>Item Name</th><th>Category</th><th>Store</th>
          <th>Stock</th><th>Threshold</th><th>Status</th>
        </tr></thead>
        <tbody id="stock-tbody"><tr><td colspan="6" class="loading">Loading...</td></tr></tbody>
      </table>
    </div>`;

  // Fetch items
  const url = currentStore ? `${API}/inventory?store=${currentStore}` : `${API}/inventory`;
  try {
    const res = await fetch(url);
    allStockItems = await res.json();
    renderStockTable();
  } catch(e) {
    document.getElementById("stock-tbody").innerHTML =
      `<tr><td colspan="6" class="empty">❌ Cannot connect to API.</td></tr>`;
  }
}

function setStockTab(t) {
  stockTab = t;
  document.querySelectorAll(".tabs .tab").forEach((b,i) => {
    b.classList.toggle("active", (i===0&&t==='all')||(i===1&&t==='low'));
  });
  renderStockTable();
}

function renderStockTable() {
  const search = (document.getElementById("stock-search")?.value || "").toLowerCase();
  const tbody  = document.getElementById("stock-tbody");
  if (!tbody) return;

  let filtered = allStockItems.filter(i => {
    const match = i.item_name.toLowerCase().includes(search) ||
                  i.category.toLowerCase().includes(search) ||
                  i.store_name.toLowerCase().includes(search);
    return match && (stockTab === "all" || i.is_low);
  });

  document.getElementById("stock-title").textContent =
    `${filtered.length} Item${filtered.length!==1?'s':''}${currentStore?' — '+currentStore:''}`;

  if (!filtered.length) {
    tbody.innerHTML = `<tr><td colspan="6" class="empty">No items found.</td></tr>`;
    return;
  }

  tbody.innerHTML = filtered.map(i => `
    <tr class="${i.is_low?'low-row':''}">
      <td>${i.item_name}</td>
      <td>${i.category}</td>
      <td><strong>${i.store_name}</strong></td>
      <td><span class="num ${i.is_low?'low':'ok'}">${i.current_stock}</span></td>
      <td>
        <input class="thresh-input" type="number" value="${i.threshold}" id="st-${i.id}" min="0"/>
        <button class="save-btn" onclick="saveStockThreshold(${i.id})">Save</button>
      </td>
      <td><span class="badge ${i.is_low?'low':'ok'}">${i.is_low?'⚠ LOW':'✓ OK'}</span></td>
    </tr>`).join("");
}

async function saveStockThreshold(id) {
  const val = document.getElementById(`st-${id}`).value;
  const res = await fetch(`${API}/inventory/${id}/threshold?threshold=${val}`, {method:"PUT"});
  if (res.ok) {
    showToast("Stock threshold updated ✓");
    await loadStoreSummary();
    await renderSidebar();
    await renderStockMain();
  }
}

// ══════════════════════════════════════════════
//  SALES VIEW
// ══════════════════════════════════════════════
async function renderSalesMain() {
  const main = document.getElementById("main-content");

  // Build month dropdown
  const monthOptions = months.map(m =>
    `<option value="${m}" ${m===selectedMonth?'selected':''}>${m}</option>`
  ).join("");

  // Stats
  const stores = currentStore ? [currentStore] : Object.keys(salesSummary);
  let totalItems=0, lowItems=0, totalQty=0;
  stores.forEach(s => {
    totalItems += salesSummary[s]?.total_items || 0;
    lowItems   += salesSummary[s]?.low_sales_items || 0;
    totalQty   += salesSummary[s]?.total_quantity || 0;
  });

  const bannerHtml = lowItems > 0 ? `
    <div class="alert-banner blue">
      <div class="icon">🔵</div>
      <div>
        <strong>⚠ ${lowItems} Low Sales Alert${lowItems>1?'s':''}</strong>
        <p>${lowItems} item${lowItems>1?' are':' is'} below sales threshold for ${selectedMonth}${currentStore?' in '+currentStore:' across all stores'}.</p>
      </div>
    </div>` : "";

  main.innerHTML = `
    <div class="month-bar">
      <label>📅 Select Month:</label>
      <select class="month-select" id="month-sel" onchange="onMonthChange(this.value)">
        ${monthOptions}
      </select>
    </div>
    ${bannerHtml}
    <div class="summary-row">
      <div class="stat-card"><div class="label">Total Items</div><div class="value">${totalItems}</div></div>
      <div class="stat-card ${lowItems>0?'blue-card':''}"><div class="label">Low Sales</div><div class="value">${lowItems}</div></div>
      <div class="stat-card"><div class="label">Total Qty Sold</div><div class="value">${Math.round(totalQty).toLocaleString()}</div></div>
      <div class="stat-card"><div class="label">Stores</div><div class="value">${stores.length}</div></div>
    </div>
    <div class="section-header">
      <h2 id="sales-title">All Sales</h2>
      <div class="tabs">
        <button class="tab blue ${salesTab==='all'?'active':''}" onclick="setSalesTab('all')">All Items</button>
        <button class="tab blue ${salesTab==='low'?'active':''}" onclick="setSalesTab('low')">⚠ Low Sales Only</button>
      </div>
    </div>
    <input class="search-bar" type="text" id="sales-search" placeholder="Search articles..." oninput="renderSalesTable()"/>
    <div class="table-wrap">
      <table>
        <thead><tr>
          <th>Article</th><th>Category</th><th>Store</th>
          <th>Qty Sold</th><th>Sales Threshold</th><th>Status</th>
        </tr></thead>
        <tbody id="sales-tbody"><tr><td colspan="6" class="loading">Loading...</td></tr></tbody>
      </table>
    </div>`;

  await fetchSalesData();
}

async function fetchSalesData() {
  const url = currentStore
    ? `${API}/sales?month=${selectedMonth}&store=${currentStore}`
    : `${API}/sales?month=${selectedMonth}`;
  try {
    const res = await fetch(url);
    allSalesItems = await res.json();
    renderSalesTable();
  } catch(e) {
    document.getElementById("sales-tbody").innerHTML =
      `<tr><td colspan="6" class="empty">❌ Cannot connect to API.</td></tr>`;
  }
}

function setSalesTab(t) {
  salesTab = t;
  renderSalesTable();
}

function renderSalesTable() {
  const search = (document.getElementById("sales-search")?.value || "").toLowerCase();
  const tbody  = document.getElementById("sales-tbody");
  if (!tbody) return;

  let filtered = allSalesItems.filter(i => {
    const match = i.article.toLowerCase().includes(search) ||
                  i.category.toLowerCase().includes(search) ||
                  i.store_name.toLowerCase().includes(search);
    return match && (salesTab === "all" || i.is_low);
  });

  document.getElementById("sales-title").textContent =
    `${filtered.length} Item${filtered.length!==1?'s':''} — ${selectedMonth}${currentStore?' — '+currentStore:''}`;

  if (!filtered.length) {
    tbody.innerHTML = `<tr><td colspan="6" class="empty">No items found.</td></tr>`;
    return;
  }

  tbody.innerHTML = filtered.map(i => {
    const hasThresh = i.threshold > 0;
    const statusBadge = !hasThresh
      ? `<span class="badge no-thresh">No threshold</span>`
      : i.is_low
        ? `<span class="badge low">⚠ LOW</span>`
        : `<span class="badge ok">✓ OK</span>`;
    const qtyClass = !hasThresh ? 'grey' : i.is_low ? 'low' : 'ok';
    const manualBadge = i.threshold_manual
      ? `<span class="manual-badge">✏ Manual</span>`
      : `<span class="auto-badge">⚡ Auto</span>`;
    const resetBtn = i.threshold_manual
      ? `<button class="reset-btn" onclick="resetSalesThreshold(${i.id})" title="Reset to auto avg: ${i.threshold_auto}">↺ Reset</button>`
      : '';
    const autoHint = !i.threshold_manual
      ? `<span class="auto-hint">avg of prev 3 months</span>`
      : `<span class="auto-hint">auto avg: ${i.threshold_auto}</span>`;
    return `
    <tr class="${i.is_low?'low-row':''}">
      <td>${i.article}</td>
      <td>${i.category}</td>
      <td><strong>${i.store_name}</strong></td>
      <td><span class="num ${qtyClass}">${i.quantity}</span></td>
      <td>
        <div class="thresh-wrap">
          <input class="thresh-input" type="number" value="${i.threshold}" id="sl-${i.id}" min="0"/>
          <button class="save-btn blue" onclick="saveSalesThreshold(${i.id})">Save</button>
          ${resetBtn}
          ${manualBadge}
          ${autoHint}
        </div>
      </td>
      <td>${statusBadge}</td>
    </tr>`;
  }).join("");
}

async function saveSalesThreshold(id) {
  const val = document.getElementById(`sl-${id}`).value;
  const res = await fetch(`${API}/sales/${id}/threshold?threshold=${val}`, {method:"PUT"});
  if (res.ok) {
    showToast("Sales threshold updated ✓");
    await loadSalesSummary();
    await renderSidebar();
    await renderSalesMain();
  }
}

async function onMonthChange(m) {
  selectedMonth = m;
  await loadSalesSummary();
  await renderSidebar();
  await renderSalesMain();
}

// ══════════════════════════════════════════════
//  EMAIL ALERT
// ══════════════════════════════════════════════
async function sendAlertNow() {
  const btn = document.getElementById("notify-btn");
  btn.disabled = true;
  btn.textContent = "⏳ Sending...";
  try {
    const url = currentStore
      ? `${API}/notify/send-now?store=${currentStore}`
      : `${API}/notify/send-now`;
    const res  = await fetch(url, {method:"POST"});
    const data = await res.json();
    if (data.status === "sent")
      showToast(`✅ Email sent! ${data.items_reported} items reported.`);
    else if (data.status === "skipped")
      showToast("✅ No low stock — nothing to report!");
    else
      showToast("❌ " + data.message, true);
  } catch(e) {
    showToast("❌ Could not reach server", true);
  }
  btn.disabled = false;
  btn.innerHTML = "📧 Send Alert Now";
}

// ══════════════════════════════════════════════
//  TOAST
// ══════════════════════════════════════════════
function showToast(msg, isError=false) {
  const t = document.getElementById("toast");
  t.textContent = msg;
  t.classList.toggle("error", isError);
  t.classList.add("show");
  setTimeout(() => t.classList.remove("show"), 3000);
}

// ══════════════════════════════════════════════
//  START
// ══════════════════════════════════════════════
init();
</script>
